<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAZATOOLS</title>
  <meta name="description" content="Des outils qui tournent dans votre navigateur, sans envoyer vos fichiers.">
  <script src="shared/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f3d35'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='17' y='9' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='9' y='17' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='17' y='17' width='6' height='6' rx='1.5' fill='%23fff' opacity='.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="hub.css">
  <script type="module" src="hub.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Afficher les outils">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <p class="topbar-title"></p>
      <button type="button" class="icon-btn theme-btn" aria-label="Passer en mode sombre">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="Outils">
      <a class="brand" href="#">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="logo-bg"/><rect x="9" y="9" width="6" height="6" rx="1.5" class="logo-fg"/><rect x="17" y="9" width="6" height="6" rx="1.5" class="logo-fg"/><rect x="9" y="17" width="6" height="6" rx="1.5" class="logo-fg"/><rect x="17" y="17" width="6" height="6" rx="1.5" class="logo-fg" opacity=".5"/></svg>
        <span class="brand-name"></span>
      </a>
      <ul class="tool-list" id="tool-list"></ul>
      <div class="side-foot">
        <a id="open-alone" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          Ouvrir dans un onglet
        </a>
        <a id="source-link" href="https://github.com/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg>
          Code source
        </a>
        <button type="button" class="theme-btn side-theme">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="theme-label">Mode sombre</span>
        </button>
      </div>
    </nav>
    <div class="scrim" hidden></div>

    <main class="stage" id="stage">
      <section class="home" id="home" aria-labelledby="home-title">
        <h1 id="home-title">Choisissez un outil</h1>
        <p class="lead">Chaque outil fonctionne dans votre navigateur&nbsp;: vos fichiers ne sont jamais envoyés sur un serveur.</p>
        <ul class="home-list" id="home-list"></ul>
      </section>
    </main>
  </div>
</body>
</html>
